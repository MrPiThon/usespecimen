name: CI

# A DESIGN.md that breaks the spec fails `astro build` — that enforcement is the
# product claim, and this workflow is what makes it true for contributions
# rather than only for whoever happens to build locally before opening a PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Not `npm install`: ci fails on a lockfile that has drifted from
      # package.json, which is a real class of broken PR.
      - run: npm ci

      # Deliberately no `npx playwright install`. Ingestion never runs here —
      # the browser is only needed to produce a capture, and the site build
      # reads captures that are already in the repo. Re-capture in CI is P2.
      - name: Build site (fails on any spec violation)
        run: npm run build

      # Prose is hand-written against a capture, and captures get re-taken. A
      # file whose words contradict its own tokens is a broken promise in the
      # same way a spec violation is, so it fails here rather than shipping.
      # The clusterer's tuning constants were each derived from a measured
      # failure on a real site, and nothing guarded them until this suite. The
      # 23 committed captures are the fixtures, so it needs no browser and no
      # network.
      - name: Test
        run: npm test

      - name: Check prose agrees with the tokens
        run: npm run check

      # The Base is one template rendered into twenty-three files. It can only
      # stay one template if a change to it is never half-applied, so a file
      # whose copy has drifted fails here rather than quietly disagreeing with
      # the other twenty-two.
      - name: Check the Base is current in every file
        run: npm run base -- --check

      - name: Check raw files are byte-identical to source
        run: |
          for f in content/systems/*/DESIGN.md; do
            slug=$(basename "$(dirname "$f")")
            if ! cmp -s "$f" "dist/r/$slug/DESIGN.md"; then
              echo "::error file=$f::/r/$slug/DESIGN.md does not match the source file"
              exit 1
            fi
          done
          echo "All $(ls -d content/systems/*/ | wc -l) raw files match their source."
